version: "3.3"
services:

  app-kaddem:
    build:
      context: .
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/kaddem?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
      - spring.jpa.hibernate.ddl-auto=update
    ports:
      - "8089:8089"
    image: "raniabensalem/kaddem-app"
    depends_on:
      - mysqldb

  mysqldb:
    image: "mysql:5.7"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=kaddem
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql   # Persistance des données

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
        - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9091:9090

  grafana:
    image: grafana/grafana
    ports:
      - 3001:3000
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db :
  grafana-data:
  prometheus_data:
  prometheus_config:
